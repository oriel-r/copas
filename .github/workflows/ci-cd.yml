name: ci-cd

on:
  push:
    branches:
      - development
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' && inputs.environment) || (github.ref_name == 'main' && 'production') || 'staging' }}
  cancel-in-progress: false

jobs:
  resolve-env:
    name: Resolve Target Environment
    runs-on: ubuntu-24.04
    outputs:
      target_env: ${{ steps.setup.outputs.target_env }}
      cloudflare_env: ${{ steps.setup.outputs.cloudflare_env }}
      default_backend_url: ${{ steps.setup.outputs.default_backend_url }}
      db_migrate_script: ${{ steps.setup.outputs.db_migrate_script }}
    steps:
      - id: setup
        name: Determine environment parameters
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENV="production"
          else
            ENV="staging"
          fi

          echo "Target environment resolved: $ENV"
          echo "target_env=$ENV" >> "$GITHUB_OUTPUT"

          if [ "$ENV" = "production" ]; then
            echo "cloudflare_env=" >> "$GITHUB_OUTPUT"
            echo "default_backend_url=https://api.orielromero-work.workers.dev" >> "$GITHUB_OUTPUT"
            echo "db_migrate_script=db:migrate:prod" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare_env=staging" >> "$GITHUB_OUTPUT"
            echo "default_backend_url=https://api-staging.orielromero-work.workers.dev" >> "$GITHUB_OUTPUT"
            echo "db_migrate_script=db:migrate:staging" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm turbo test --filter="...[${{ github.event.before }}]" --continue

  build:
    name: Build Packages and Apps
    needs: [test, resolve-env]
    environment: ${{ needs.resolve-env.outputs.target_env }}
    runs-on: ubuntu-24.04
    env:
      VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || needs.resolve-env.outputs.default_backend_url }}
      VITE_AUTH_PATH: ${{ vars.VITE_AUTH_PATH || '/auth' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build --filter="...[${{ github.event.before }}]" --continue

      - name: Upload Client Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist-${{ needs.resolve-env.outputs.target_env }}
          path: src/apps/client/dist
          if-no-files-found: ignore
          retention-days: 1

  migration:
    name: Apply D1 Migrations
    needs: [build, resolve-env]
    environment: ${{ needs.resolve-env.outputs.target_env }}
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: ${{ needs.resolve-env.outputs.cloudflare_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 Migrations
        run: pnpm --filter api ${{ needs.resolve-env.outputs.db_migrate_script }}

  deploy:
    name: Deploy to Cloudflare
    needs: [build, migration, resolve-env]
    environment: ${{ needs.resolve-env.outputs.target_env }}
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: ${{ needs.resolve-env.outputs.cloudflare_env }}
      VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || needs.resolve-env.outputs.default_backend_url }}
      VITE_AUTH_PATH: ${{ vars.VITE_AUTH_PATH || '/auth' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Client Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist-${{ needs.resolve-env.outputs.target_env }}
          path: src/apps/client/dist
        continue-on-error: true

      - name: Deploy
        run: pnpm turbo deploy --filter="...[${{ github.event.before }}]" --continue
