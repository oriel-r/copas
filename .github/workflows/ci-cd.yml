name: ci-cd

on:
  push:
    branches:
      - development
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' && inputs.environment) || (github.ref_name == 'main' && 'production') || 'staging' }}
  cancel-in-progress: false

jobs:
  ci:
    name: Validate and Build (CI)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Build Environment
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TARGET="production"
          else
            TARGET="staging"
          fi
          echo "TARGET_ENV=$TARGET" >> "$GITHUB_ENV"

          if [ -n "${{ vars.VITE_BACKEND_URL }}" ]; then
            echo "VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }}" >> "$GITHUB_ENV"
          elif [ "$TARGET" = "production" ]; then
            echo "VITE_BACKEND_URL=https://api.orielromero-work.workers.dev" >> "$GITHUB_ENV"
          else
            echo "VITE_BACKEND_URL=https://api-staging.orielromero-work.workers.dev" >> "$GITHUB_ENV"
          fi

          echo "VITE_AUTH_PATH=${{ vars.VITE_AUTH_PATH || '/auth' }}" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests and Build in Parallel
        run: pnpm turbo run test build --filter="...[${{ github.event.before }}]" --continue --cache-dir=".turbo"

      - name: Upload Client Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist-${{ env.TARGET_ENV }}
          path: src/apps/client/dist
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    name: Migrate and Deploy (CD)
    needs: ci
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment) || (github.ref_name == 'main' && 'production') || 'staging' }}
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Deployment Environment
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TARGET="production"
          else
            TARGET="staging"
          fi
          echo "TARGET_ENV=$TARGET" >> "$GITHUB_ENV"

          if [ "$TARGET" = "production" ]; then
            echo "CLOUDFLARE_ENV=" >> "$GITHUB_ENV"
            echo "DB_MIGRATE_SCRIPT=db:migrate:prod" >> "$GITHUB_ENV"
            FALLBACK_URL="https://api.orielromero-work.workers.dev"
          else
            echo "CLOUDFLARE_ENV=staging" >> "$GITHUB_ENV"
            echo "DB_MIGRATE_SCRIPT=db:migrate:staging" >> "$GITHUB_ENV"
            FALLBACK_URL="https://api-staging.orielromero-work.workers.dev"
          fi

          if [ -n "${{ vars.VITE_BACKEND_URL }}" ]; then
            echo "VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }}" >> "$GITHUB_ENV"
          else
            echo "VITE_BACKEND_URL=$FALLBACK_URL" >> "$GITHUB_ENV"
          fi

          echo "VITE_AUTH_PATH=${{ vars.VITE_AUTH_PATH || '/auth' }}" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Restore Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Client Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist-${{ env.TARGET_ENV }}
          path: src/apps/client/dist
        continue-on-error: true

      - name: Apply D1 Migrations
        run: pnpm --filter api run $DB_MIGRATE_SCRIPT

      - name: Deploy to Cloudflare
        run: pnpm turbo deploy --filter="...[${{ github.event.before }}]" --continue --cache-dir=".turbo"
