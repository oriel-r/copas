name: ci-cd-staging

on:
  pull_request:
    branches: "main"

jobs:
  test:
    environment: staging
    runs-on: ubuntu-24.04
    steps:
      - name: project_setup
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: proejct validation
        run: ls
      - name: node_and_pnpm_setup
        uses: pnpm/setup@v1.0.0
        with:
          version: 11.13.0
          runtime: node@24.x
          install: false
      - name: validation
        run: node -v && pnpm -v
