name: ci-cd-staging

on:
  push:
    branches:
      - development

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run Tests
        run: pnpm turbo test --filter=...[origin/development]

  build_and_deploy:
    needs: test
    environment: staging
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: build & deploy
        run: pnpm turbo deploy --filter=...[origin/development]
