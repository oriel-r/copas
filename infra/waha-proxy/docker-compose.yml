services:
  waha:
    image: devlikeapro/waha:latest
    container_name: copas-waha
    restart: unless-stopped
    # Solo accesible desde localhost para escanear QR / administrar sesiones. Nunca exponer a Tailscale Funnel.
    ports:
      - "127.0.0.1:${WAHA_LOCAL_PORT:-3000}:3000"
    volumes:
      - ./data/waha-sessions:/app/.sessions:Z
      - ./data/waha-media:/app/media:Z
    environment:
      - WHATSAPP_DEFAULT_ENGINE=${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      - WAHA_LOCAL_STORE_BASE_DIR=/app/.sessions
      - WHATSAPP_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_HOOK_URL=http://waha-proxy:8080/internal/waha-webhook
      - WHATSAPP_HOOK_EVENTS=message,message.ack,session.status
      - WHATSAPP_HOOK_HMAC_KEY=${WAHA_WEBHOOK_HMAC_KEY}
      - WHATSAPP_START_SESSION=${WAHA_DEFAULT_SESSION:-default}
    networks:
      - waha-net

  waha-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copas-waha-proxy
    restart: unless-stopped
    depends_on:
      - waha
    # Solo accesible desde localhost para enlazar Tailscale Funnel (tailscale serve --https=443 --bg http://127.0.0.1:8080)
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - WAHA_BASE_URL=http://waha:3000
      - DB_PATH=/app/data/proxy.db
      - SESSIONS_CONFIG_PATH=/app/config/sessions.json
      - TEMPLATES_CONFIG_PATH=/app/config/templates.json
    volumes:
      - ./data/proxy:/app/data:Z
      - ./config:/app/config:ro,Z
    networks:
      - waha-net

networks:
  waha-net:
    driver: bridge
